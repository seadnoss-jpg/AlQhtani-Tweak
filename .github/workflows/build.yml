name: Build Al-Qhtani Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y git make curl xz-utils fakeroot dpkg-dev zip
        curl -L "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64" -o /usr/local/bin/ldid
        sudo chmod +x /usr/local/bin/ldid

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV

    - name: Download iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        curl -L --retry 3 \
          "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" \
          -o /tmp/sdk.tar.xz
        tar -xJf /tmp/sdk.tar.xz -C $HOME/theos/sdks

    - name: Build Tweak
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Upload .deb package
      uses: actions/upload-artifact@v4
      with:
        name: AlQhtani-deb
        path: packages/*.deb
        if-no-files-found: warn

    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: AlQhtani-dylib
        path: .theos/obj/debug/*.dylib
        if-no-files-found: warn
