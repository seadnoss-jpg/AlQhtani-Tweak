name: Build Al-Qhtani Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make curl xz-utils pkg-config libssl-dev libbsd-dev fakeroot dpkg-dev ldid

    - name: Setup Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: Download iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        curl -L --retry 3 "https://github.com/theos/sdks/releases/download/ios-16.2-fallback/iPhoneOS16.2.sdk.tar.xz" -o /tmp/sdk.tar.xz
        tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export THEOS_MAKE_PATH=$THEOS/makefiles
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Upload .deb package
      uses: actions/upload-artifact@v4
      with:
        name: AlQhtani-deb
        path: packages/*.deb
        if-no-files-found: warn

    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: AlQhtani-dylib
        path: .theos/obj/debug/*.dylib
        if-no-files-found: warn
