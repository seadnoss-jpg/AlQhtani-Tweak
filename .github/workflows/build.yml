name: Build Al-Qhtani Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/theos/theos-ci:latest
      options: --user root

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Tweak
      run: |
        export THEOS=/theos
        make clean
        make package FINALPACKAGE=1

    - name: Upload .deb package
      uses: actions/upload-artifact@v4
      with:
        name: AlQhtani-deb
        path: packages/*.deb
        if-no-files-found: warn

    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: AlQhtani-dylib
        path: .theos/obj/debug/*.dylib
        if-no-files-found: warn
