name: Build Al-Qhtani Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Theos
      uses: theos/theos-action@v1
      with:
        cache: false
        sdk: none

    - name: Build Tweak
      run: |
        make clean
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Upload .deb package
      uses: actions/upload-artifact@v4
      with:
        name: AlQhtani-deb
        path: packages/*.deb
        if-no-files-found: warn

    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: AlQhtani-dylib
        path: .theos/obj/debug/*.dylib
        if-no-files-found: warn
